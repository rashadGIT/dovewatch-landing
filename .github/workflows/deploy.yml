name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SHARED_TYPES_READ_TOKEN }}

      - run: npm run build

      # Scoped to this bucket + this distribution only — see
      # infrastructure/lib/stacks/landing-stack.ts's DoveWatchLandingDeployRole.
      # Not the account's broader CDK/Amplify deploy roles.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_LANDING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Sync to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_LANDING_BUCKET_NAME }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_LANDING_DISTRIBUTION_ID }} \
            --paths "/*"
